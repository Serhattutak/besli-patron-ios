appId: com.sardurtechnologies.beslipatron
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
# The tutorial is mounted globally and can cover the intro screen.
# Dismiss it before trying to skip the story or start the game.
- tapOn:
    text: "Öğreticiyi Atla"
- tapOn:
    text: "Hikayeyi atla"
- extendedWaitUntil:
    visible: "Oyuna Başla"
    timeout: 15000
- tapOn:
    text: "Oyuna Başla"
- extendedWaitUntil:
    visible: "Günü Bitir"
    timeout: 30000
- tapOn:
    text: "Günü Bitir"
# Wait until the inline report is rendered before checking for the new-day
# event. The event is random and its native Modal can cover the report button.
- extendedWaitUntil:
    visible: "Kapat ve Devam Et"
    timeout: 15000
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
- tapOn:
    text: "Kapat ve Devam Et"
- tapOn:
    text: "İşletme"
- assertVisible:
    text: "İşletme"
