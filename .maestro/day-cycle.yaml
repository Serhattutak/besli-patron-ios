appId: com.sardurtechnologies.beslipatron
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
# The tutorial is mounted globally and can cover the intro screen.
# Dismiss it before trying to skip the story or start the game.
- tapOn:
    text: "Öğreticiyi Atla"
- tapOn:
    text: "Hikayeyi atla"
- extendedWaitUntil:
    visible: "Oyuna Başla"
    timeout: 15000
- tapOn:
    text: "Oyuna Başla"
- extendedWaitUntil:
    visible: "Günü Bitir"
    timeout: 30000
- tapOn:
    text: "Günü Bitir"
# A new-day event is shown in a native Modal above the inline day-end report.
# Resolve it first if present, otherwise it can block the report's close button.
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
- extendedWaitUntil:
    visible: "Kapat ve Devam Et"
    timeout: 15000
- tapOn:
    text: "Kapat ve Devam Et"
- tapOn:
    text: "İşletme"
- assertVisible:
    text: "İşletme"
