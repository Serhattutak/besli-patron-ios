appId: com.sardurtechnologies.beslipatron
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
# Dismiss the globally mounted tutorial before leaving the intro.
- tapOn:
    text: "Öğreticiyi Atla"
- tapOn:
    text: "Hikayeyi atla"
- extendedWaitUntil:
    visible: "Oyuna Başla"
    timeout: 15000
- tapOn:
    text: "Oyuna Başla"
- extendedWaitUntil:
    visible: "Günü Bitir"
    timeout: 30000
- tapOn:
    text: "Günü Bitir"
# A random new-day event uses a native Modal and can cover the inline report.
# Resolve it first if present, then close the report.
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
- extendedWaitUntil:
    visible: "Kapat ve Devam Et"
    timeout: 15000
- tapOn:
    text: "Kapat ve Devam Et"
- tapOn:
    text: "İşletme"
- assertVisible:
    text: "İşletme"
