appId: com.sardurtechnologies.beslipatron
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
# Dismiss the globally mounted tutorial before leaving the intro.
- tapOn:
    text: "Öğreticiyi Atla"
- tapOn:
    text: "Hikayeyi atla"
- extendedWaitUntil:
    visible: "Oyuna Başla"
    timeout: 15000
- tapOn:
    text: "Oyuna Başla"
- extendedWaitUntil:
    visible: "Günü Bitir"
    timeout: 30000
# Day 1 -> Day 2
- tapOn:
    text: "Günü Bitir"
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
- extendedWaitUntil:
    visible: "Kapat ve Devam Et"
    timeout: 15000
- tapOn:
    text: "Kapat ve Devam Et"
# Verify navigation away and back doesn't leave the screen blocked.
- tapOn:
    text: "İşletme"
- assertVisible:
    text: "İşletme"
- tapOn:
    text: "Saha"
- extendedWaitUntil:
    visible: "Günü Bitir"
    timeout: 15000
# Day 2 -> Day 3 (catches a stale day-end lock or state closure).
- tapOn:
    text: "Günü Bitir"
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
- extendedWaitUntil:
    visible: "Kapat ve Devam Et"
    timeout: 15000
- tapOn:
    text: "Kapat ve Devam Et"
- tapOn:
    text: "İşletme"
- assertVisible:
    text: "İşletme"
