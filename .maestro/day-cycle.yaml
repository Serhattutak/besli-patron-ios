- tapOn:
    text: "Günü Bitir"
- extendedWaitUntil:
    visible: "Kapat ve Devam Et"
    timeout: 15000
- tapOn:
    text: "Kapat ve Devam Et"
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
- tapOn:
    text: "İşletme"
    optional: true
- assertVisible:
    text: "İşletme"
