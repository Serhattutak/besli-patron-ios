appId: com.sardurtechnologies.beslipatron
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
# Dismiss the globally mounted tutorial before leaving the intro.
- tapOn:
    text: "Öğreticiyi Atla"
- tapOn:
    text: "Hikayeyi atla"
- extendedWaitUntil:
    visible: "Oyuna Başla"
    timeout: 15000
- tapOn:
    text: "Oyuna Başla"
# A random event can appear immediately when the new game starts.
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
- extendedWaitUntil:
    visible: "Günü Bitir"
    timeout: 30000
# Day 1 -> Day 2
- tapOn:
    text: "Günü Bitir"
- extendedWaitUntil:
    visible: "Kapat ve Devam Et"
    timeout: 15000
- assertVisible:
    text: ".*Gün 1 Bitti!.*"
- tapOn:
    text: "Kapat ve Devam Et"
# The new-day event is shown after the report closes, never on top of it.
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
# Verify navigation away and back doesn't leave the screen blocked.
- tapOn:
    point: "25%, 96%"
- tapOn:
    point: "8%, 96%"
- extendedWaitUntil:
    visible: "Günü Bitir"
    timeout: 15000
# Day 2 -> Day 3 (catches a stale day-end lock or state closure).
- tapOn:
    text: "Günü Bitir"
- extendedWaitUntil:
    visible: "Kapat ve Devam Et"
    timeout: 15000
- assertVisible:
    text: ".*Gün 2 Bitti!.*"
- tapOn:
    text: "Kapat ve Devam Et"
# The new-day event is shown after the report closes, never on top of it.
- tapOn:
    text: "Olay seçeneği 1"
    optional: true
- tapOn:
    point: "25%, 96%"
