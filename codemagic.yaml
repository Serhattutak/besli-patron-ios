workflows:
  ios-testflight:
    name: Besli Patron iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sardurtechnologies.beslipatron
      node: v20.19.4
      xcode: 16.4
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Generate iOS project
        script: npx expo prebuild --platform ios --non-interactive

      - name: Set Expo import access level
        script: |
          set -euo pipefail
          app_delegates="$(find "$CM_BUILD_DIR/ios" -type f -name "AppDelegate.swift" -print)"
          candidate_count=0
          beli_patron_count=0
          app_delegate=""
          beli_patron_delegate=""

          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            candidate_count=$((candidate_count + 1))
            app_delegate="$candidate"
            case "$candidate" in
              */BeliPatron/*)
                beli_patron_count=$((beli_patron_count + 1))
                beli_patron_delegate="$candidate"
                ;;
            esac
          done <<< "$app_delegates"

          if [ "$candidate_count" -eq 0 ]; then
            echo "Error: No AppDelegate.swift found under $CM_BUILD_DIR/ios"
            exit 1
          elif [ "$candidate_count" -gt 1 ]; then
            if [ "$beli_patron_count" -eq 1 ]; then
              app_delegate="$beli_patron_delegate"
            else
              echo "Error: Multiple AppDelegate.swift files found and no unique BeliPatron target could be selected"
              printf '%s\n' "$app_delegates"
              exit 1
            fi
          fi

          if grep -q -E '^[[:space:]]*internal import Expo[[:space:]]*$' "$app_delegate"; then
            echo "internal import Expo is already present"
          elif grep -q -E '^[[:space:]]*import Expo[[:space:]]*$' "$app_delegate"; then
            perl -0pi -e 's/^([ \t]*)import Expo[ \t]*\r?$/\1internal import Expo/m' "$app_delegate"
          else
            echo "Error: Exact import Expo line not found in $app_delegate"
            exit 1
          fi

          if head -20 "$app_delegate" | grep -n -E '^[[:space:]]*internal import Expo[[:space:]]*$'; then
            echo "Verified internal import Expo in the first lines"
          else
            echo "Error: internal import Expo verification failed"
            exit 1
          fi

          echo "Using AppDelegate.swift: $app_delegate"

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Diagnose generated iOS CocoaPods project
        script: |
          set +e
          cd "$CM_BUILD_DIR"

          echo "===== Xcode version ====="
          xcodebuild -version

          echo "===== Expo version ====="
          node -p "require('expo/package.json').version"

          echo "===== Google Mobile Ads package version ====="
          node -p "require('react-native-google-mobile-ads/package.json').version"

          echo "===== ios/Podfile ====="
          if [ -f ios/Podfile ]; then cat ios/Podfile; else echo "ios/Podfile not found"; fi

          echo "===== ios/Podfile.properties.json ====="
          if [ -f ios/Podfile.properties.json ]; then cat ios/Podfile.properties.json; else echo "ios/Podfile.properties.json not found"; fi

          echo "===== Installed Expo and Google Mobile Ads pod directories ====="
          find ios/Pods -type d \( -name "Expo" -o -name "ExpoModulesCore" -o -name "ExpoSplashScreen" -o -name "Google-Mobile-Ads-SDK" \) -print

          echo "===== Target Support Files matching Expo, Google, or app Pods ====="
          find "ios/Pods/Target Support Files" -type f -print 2>/dev/null | sort | grep -E "Expo|expo|Google|Pods-BeliPatron"

          echo "===== Expo and Google module maps ====="
          find ios/Pods -type f -name "*.modulemap" -print 2>/dev/null | sort | grep -E "Expo|expo|Google"

          echo "===== Pod project files ====="
          find ios/Pods -type d -name "*.xcodeproj" -print

          echo "===== App workspace schemes ====="
          workspace="$(find "$CM_BUILD_DIR/ios" -type d -name '*.xcworkspace' -prune -print | grep -v '/Pods/' | head -n 1)"
          if [ -n "$workspace" ]; then
            echo "Workspace: $workspace"
            xcodebuild -list -workspace "$workspace"
          else
            echo "App .xcworkspace not found"
          fi

          echo "===== use_expo_modules! in ios/Podfile ====="
          if [ -f ios/Podfile ] && grep -n "use_expo_modules!" ios/Podfile; then
            echo "use_expo_modules! found"
          else
            echo "use_expo_modules! not found"
          fi

          echo "===== Expo and Google Mobile Ads entries in Podfile.lock (first 100 matches) ====="
          if [ -f ios/Podfile.lock ]; then
            grep -E "Expo|expo-|Google-Mobile-Ads" ios/Podfile.lock | head -100
          else
            echo "ios/Podfile.lock not found"
          fi

      - name: Diagnose Expo Swift product and build settings
        script: |
          set +e
          cd "$CM_BUILD_DIR"

          echo "===== Expo pod target directories ====="
          find "$CM_BUILD_DIR/ios/Pods" -type d -name "Expo" -print

          echo "===== Expo products under ios/Pods (files and bundle directories) ====="
          find "$CM_BUILD_DIR/ios/Pods" -type f \( -name "Expo.framework" -o -name "Expo.swiftmodule" -o -name "*.swiftmodule" \) -print | grep -E "/Expo/|Expo\.framework|Expo\.swiftmodule" || true
          find "$CM_BUILD_DIR/ios/Pods" -type d \( -name "Expo.framework" -o -name "Expo.swiftmodule" -o -name "*.swiftmodule" \) -print | grep -E "/Expo/|Expo\.framework|Expo\.swiftmodule" || true

          echo "===== Expo products in DerivedData before archive ====="
          expo_derived_products="$(find "$HOME/Library/Developer/Xcode/DerivedData" \( -type f -o -type d \) \( -name "Expo.swiftmodule" -o -name "Expo.framework" -o -name "Expo" \) -print 2>/dev/null)"
          if [ -n "$expo_derived_products" ]; then
            printf '%s\n' "$expo_derived_products" | head -100
          else
            echo "Expo product not built before archive"
          fi

          echo "===== Pods-BeliPatron debug xcconfig Expo entries ====="
          grep -n -A 30 -B 10 "Expo" "ios/Pods/Target Support Files/Pods-BeliPatron/Pods-BeliPatron.debug.xcconfig" || true

          echo "===== Pods-BeliPatron release xcconfig Expo entries ====="
          grep -n -A 30 -B 10 "Expo" "ios/Pods/Target Support Files/Pods-BeliPatron/Pods-BeliPatron.release.xcconfig" || true

          echo "===== Pods project files containing Expo ====="
          find ios/Pods -type f -name "project.pbxproj" -print0 | xargs -0 grep -l "Expo" | head -20

          echo "===== Expo module/product build settings in Pods projects ====="
          find ios/Pods -type f -name "project.pbxproj" -print0 | xargs -0 grep -n -E "PRODUCT_MODULE_NAME.*Expo|PRODUCT_NAME.*Expo|DEFINES_MODULE.*YES" | head -100

          echo "===== Expo entries in Podfile.lock ====="
          grep -n -A 5 -B 2 "^  - Expo" ios/Podfile.lock || true
          grep -n -A 5 -B 2 "^  - ExpoModulesCore" ios/Podfile.lock || true

          echo "===== BeliPatron Release build settings from workspace and scheme ====="
          workspace="$(find "$CM_BUILD_DIR/ios" -type d -name '*.xcworkspace' -prune -print -quit)"
          if [ -z "$workspace" ]; then
            echo "No .xcworkspace found for build settings"
          else
            schemes_json="$(xcodebuild -list -json -workspace "$workspace")"
            scheme="$(printf '%s' "$schemes_json" | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          schemes = data.get("workspace", {}).get("schemes", [])
          stem = os.path.basename(sys.argv[1])[:-len(".xcworkspace")]
          if stem in schemes:
              print(stem)
          else:
              app_schemes = [name for name in schemes if not name.startswith("Pods-")]
              if len(app_schemes) == 1:
                  print(app_schemes[0])
              else:
                  print("Could not identify a unique app scheme: " + ", ".join(schemes), file=sys.stderr)
                  sys.exit(1)
          ' "$workspace")"
            if [ -n "$scheme" ]; then
              echo "Workspace: $workspace"
              echo "Scheme: $scheme"
              xcodebuild -showBuildSettings -workspace "$workspace" -scheme "$scheme" -configuration Release | awk '
                /^Build settings for action build and target / {
                  show = ($0 ~ /BeliPatron|BesliPatron/)
                  if (show) print
                  next
                }
                show && /^[[:space:]]*(FRAMEWORK_SEARCH_PATHS|SWIFT_INCLUDE_PATHS|HEADER_SEARCH_PATHS|OTHER_SWIFT_FLAGS|SWIFT_OBJC_INTERFACE_HEADER_NAME|PRODUCT_MODULE_NAME|PRODUCT_NAME)[[:space:]]*=/ { print }
              '
            else
              echo "App scheme not identified; skipped showBuildSettings"
            fi
          fi

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          set -euo pipefail

          workspace="$(find "$CM_BUILD_DIR/ios" -type d -name '*.xcworkspace' -prune -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "Error: No .xcworkspace found in $CM_BUILD_DIR/ios"
            exit 1
          fi

          schemes_json="$(xcodebuild -list -json -workspace "$workspace")"
          scheme="$(printf '%s' "$schemes_json" | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          workspace = data.get("workspace", {})
          schemes = workspace.get("schemes", [])
          workspace_name = os.path.basename(sys.argv[1])
          stem = workspace_name[:-len(".xcworkspace")]
          if stem in schemes:
              print(stem)
          else:
              app_schemes = [name for name in schemes if not name.startswith("Pods-")]
              if len(app_schemes) == 1:
                  print(app_schemes[0])
              else:
                  print("Could not identify a unique app scheme. Available schemes: " + ", ".join(schemes), file=sys.stderr)
                  sys.exit(1)
          ' "$workspace")"

          echo "Using workspace: $workspace"
          echo "Using scheme: $scheme"
          xcode-project build-ipa \
            --workspace "$workspace" \
            --scheme "$scheme" \
            --archive-xcargs "SWIFT_ENABLE_EXPLICIT_MODULES=NO"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
