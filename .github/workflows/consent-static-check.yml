name: Consent Change Static Checks

on:
  push:
    branches:
      - fix/ad-consent-gating
    paths:
      - "services/adManager.ts"
      - "app/tabs/profil.tsx"
      - "utils/hataYakala.ts"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/consent-static-check.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate app.json
        run: node -e "JSON.parse(require('fs').readFileSync('app.json', 'utf8').replace(/^\\uFEFF/, ''))"
      - name: Report dependency audit findings (non-blocking)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/audit.json', 'utf8'));
          const meta = audit.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit totals:', JSON.stringify(meta));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            const via = (item.via ?? []).map(v => typeof v === 'string' ? v : v.name + (v.title ? ': ' + v.title : ''));
            console.log(`- ${name}: severity=${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}; via=${via.join('; ')}`);
          }
          NODE
      - name: Confirm diagnostics do not write to clipboard
        run: |
          if grep -n "Clipboard\\|setStringAsync" utils/hataYakala.ts; then
            echo "::error::Automatic clipboard writes remain in diagnostics."
            exit 1
          fi
      - name: TypeScript check (report pre-existing errors separately)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > "$RUNNER_TEMP/tsc.log" 2>&1
          TSC_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/tsc.log"
          if grep -E '^(services/adManager[.]ts|utils/hataYakala[.]ts|app/tabs/profil[.]tsx)[(]' "$RUNNER_TEMP/tsc.log"; then
            echo "::error::TypeScript errors found in changed source files."
            exit 1
          fi
          if [ "$TSC_STATUS" -ne 0 ]; then
            echo "::warning::Existing TypeScript errors outside the consent/diagnostics changes remain."
          fi
