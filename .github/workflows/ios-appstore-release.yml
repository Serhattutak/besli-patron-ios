name: iOS App Store Build and Upload

on:
  workflow_dispatch:
  push:
    branches:
      - ios-appstore-release
    paths:
      - 'release-trigger.txt'

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout App Store release branch
        uses: actions/checkout@v4
        with:
          ref: ios-appstore-release

      - name: Verify Xcode and iOS SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/Xcode/ {print $2}')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          echo "XCODE_VERSION=$XCODE_VERSION"
          echo "IOS_SDK_VERSION=$IOS_SDK_VERSION"
          if [ "$XCODE_MAJOR" -lt 26 ] || [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::App Store submissions require Xcode 26+ and the iOS 26 SDK or newer."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare App Store signing files
        shell: bash
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: f79c1bb6-4617-4acf-b6df-d23a286f9f51
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${IOS_DIST_CERT_BASE64:?Missing IOS_DIST_CERT_BASE64 secret}"
          : "${IOS_DIST_CERT_PASSWORD:?Missing IOS_DIST_CERT_PASSWORD secret}"
          : "${APPSTORE_PROVISIONING_PROFILE_BASE64:?Missing APPSTORE_PROVISIONING_PROFILE_BASE64 secret}"
          : "${APPSTORE_API_KEY_ID:?Missing APPSTORE_API_KEY_ID secret}"
          : "${APPSTORE_API_ISSUER_ID:?Missing APPSTORE_API_ISSUER_ID secret}"
          : "${APPSTORE_API_KEY_P8_BASE64:?Missing APPSTORE_API_KEY_P8_BASE64 secret}"

          mkdir -p "$RUNNER_TEMP/signing"
          printf "%s" "$IOS_DIST_CERT_BASE64" | tr -d "[:space:]" | base64 -D > "$RUNNER_TEMP/signing/dist-cert.p12"
          printf "%s" "$APPSTORE_PROVISIONING_PROFILE_BASE64" | tr -d "[:space:]" | base64 -D > "$RUNNER_TEMP/signing/appstore-profile.mobileprovision"

          security create-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/signing/dist-cert.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          SIGNING_IDENTITIES="$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db")"
          if ! printf "%s\n" "$SIGNING_IDENTITIES" | grep -Eq '"Apple Distribution:.*\(WNF86CPGX5\)"'; then
            echo "::error::No Apple Distribution identity found for team WNF86CPGX5."
            exit 1
          fi

          security cms -D -i "$RUNNER_TEMP/signing/appstore-profile.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print:UUID" "$RUNNER_TEMP/signing/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print:Name" "$RUNNER_TEMP/signing/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print:Entitlements:application-identifier" "$RUNNER_TEMP/signing/profile.plist")
          if [[ "$PROFILE_APP_ID" != *".com.sardurtechnologies.beslipatron" ]]; then
            echo "::error::The App Store provisioning profile does not match the Beşli Patron bundle ID."
            exit 1
          fi

          # Compare public certificate fingerprints without printing or exposing private key material.
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/signing/dist-cert.p12" -clcerts -nokeys \
            -passin env:IOS_DIST_CERT_PASSWORD -out "$RUNNER_TEMP/signing/dist-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/signing/dist-cert.pem" -outform DER \
            -out "$RUNNER_TEMP/signing/dist-cert.der"
          python3 - "$RUNNER_TEMP/signing/profile.plist" "$RUNNER_TEMP/signing/dist-cert.der" <<'PY'
          import hashlib, plistlib, sys
          profile_path, p12_der_path = sys.argv[1:3]
          with open(profile_path, "rb") as f:
              profile = plistlib.load(f)
          with open(p12_der_path, "rb") as f:
              p12_der = f.read()
          p12_sha = hashlib.sha1(p12_der).hexdigest().upper()
          certs = profile.get("DeveloperCertificates", [])
          profile_shas = [hashlib.sha1(cert).hexdigest().upper() for cert in certs]
          print(f"Imported P12 leaf certificate SHA1: {p12_sha}")
          print("Provisioning profile DeveloperCertificates SHA1 fingerprints:")
          for fingerprint in profile_shas:
              print(f"  {fingerprint}")
          print("Certificate match:", "YES" if p12_sha in profile_shas else "NO")
          PY

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing/appstore-profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf "%s" "$APPSTORE_API_KEY_P8_BASE64" | tr -d "[:space:]" | base64 -D > \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install

      - name: Detect iOS workspace and scheme
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::iOS workspace not found."
            exit 1
          fi
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/ {found=1; next} found && NF {print $1; exit}')"
          if [ -z "$SCHEME" ]; then
            echo "::error::Xcode scheme not found."
            exit 1
          fi
          echo "IOS_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          echo "Provisioning profile: $PROFILE_NAME"

      - name: Create App Store ExportOptions.plist
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>WNF86CPGX5</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sardurtechnologies.beslipatron</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Archive for App Store
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive"
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/archive/BesliPatron.xcarchive" \
            DEVELOPMENT_TEAM=WNF86CPGX5 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export App Store IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/archive/BesliPatron.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -n "$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.ipa" -print -quit)"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: besli-patron-ios-appstore
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to App Store Connect
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: f79c1bb6-4617-4acf-b6df-d23a286f9f51
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.ipa" -print -quit)"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
