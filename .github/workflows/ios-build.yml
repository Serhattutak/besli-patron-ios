name: iOS Ad Hoc Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Apple signing files
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_DEVICE_UDID: ${{ secrets.IOS_DEVICE_UDID }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/signing"

          CERT_LEN=${#IOS_DIST_CERT_BASE64}
          echo "DIST_CERT_BASE64_LENGTH=$CERT_LEN"
          printf "%s" "$IOS_DIST_CERT_BASE64" | tr -d "[:space:]" | base64 -D > "$RUNNER_TEMP/signing/dist-cert.p12"
          printf "%s" "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d "[:space:]" | base64 -D > "$RUNNER_TEMP/signing/profile.mobileprovision"

          security create-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"

          security import "$RUNNER_TEMP/signing/dist-cert.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          if SIGNING_IDENTITIES=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" 2>/dev/null); then
            SIGNING_IDENTITY_CHECK_STATUS=0
          else
            SIGNING_IDENTITY_CHECK_STATUS=$?
            SIGNING_IDENTITIES=""
          fi

          if [ "$SIGNING_IDENTITY_CHECK_STATUS" -ne 0 ]; then
            echo "[SIGNING_VERIFY] VALID_CODE_SIGNING_IDENTITY=UNVERIFIABLE"
            echo "[SIGNING_VERIFY] APPLE_DISTRIBUTION_TEAM_MATCH=UNVERIFIABLE"
            echo "::error::Signing identity verification failed; result is unverifiable."
            exit "$SIGNING_IDENTITY_CHECK_STATUS"
          fi

          VALID_IDENTITY_COUNT=$(printf "%s\n" "$SIGNING_IDENTITIES" | awk '/^[[:space:]]*[0-9]+\)/ { count++ } END { print count+0 }')
          if [ "$VALID_IDENTITY_COUNT" -gt 0 ]; then
            echo "[SIGNING_VERIFY] VALID_CODE_SIGNING_IDENTITY=YES"
          else
            echo "[SIGNING_VERIFY] VALID_CODE_SIGNING_IDENTITY=NO"
          fi

          if printf "%s\n" "$SIGNING_IDENTITIES" | grep -Eq '"Apple Distribution:.*\(WNF86CPGX5\)"'; then
            echo "[SIGNING_VERIFY] APPLE_DISTRIBUTION_TEAM_MATCH=YES"
          else
            echo "[SIGNING_VERIFY] APPLE_DISTRIBUTION_TEAM_MATCH=NO"
            echo "::error::No Apple Distribution signing identity matched the configured team."
            exit 1
          fi

          echo "[SIGNING_TRACE] Provisioning profile processing: START"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "[SIGNING_TRACE] Profile UUID/name extraction: START"
          echo "[SIGNING_TRACE] security cms for UUID: START"
          if security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"; then
            echo "[SIGNING_TRACE] security cms for UUID: SUCCESS (exit 0)"
          else
            SECURITY_CMS_UUID_STATUS=$?
            echo "[SIGNING_TRACE] security cms for UUID: FAILED (exit ${SECURITY_CMS_UUID_STATUS})"
            exit "$SECURITY_CMS_UUID_STATUS"
          fi

          echo "[SIGNING_TRACE] PlistBuddy for UUID: START"
          if PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print:UUID" "$RUNNER_TEMP/signing/profile.plist"); then
            echo "[SIGNING_TRACE] PlistBuddy for UUID: SUCCESS (exit 0)"
          else
            PLISTBUDDY_UUID_STATUS=$?
            echo "[SIGNING_TRACE] PlistBuddy for UUID: FAILED (exit ${PLISTBUDDY_UUID_STATUS})"
            exit "$PLISTBUDDY_UUID_STATUS"
          fi

          echo "[SIGNING_TRACE] security cms for profile name: START"
          if security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"; then
            echo "[SIGNING_TRACE] security cms for profile name: SUCCESS (exit 0)"
          else
            SECURITY_CMS_NAME_STATUS=$?
            echo "[SIGNING_TRACE] security cms for profile name: FAILED (exit ${SECURITY_CMS_NAME_STATUS})"
            exit "$SECURITY_CMS_NAME_STATUS"
          fi

          echo "[SIGNING_TRACE] PlistBuddy for profile name: START"
          if PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print:Name" "$RUNNER_TEMP/signing/profile.plist"); then
            echo "[SIGNING_TRACE] PlistBuddy for profile name: SUCCESS (exit 0)"
          else
            PLISTBUDDY_NAME_STATUS=$?
            echo "[SIGNING_TRACE] PlistBuddy for profile name: FAILED (exit ${PLISTBUDDY_NAME_STATUS})"
            exit "$PLISTBUDDY_NAME_STATUS"
          fi
          echo "[SIGNING_TRACE] Profile UUID/name extraction: DONE"

          python3 - <<'PY'
          import os
          import plistlib

          try:
              udid = os.environ.get("IOS_DEVICE_UDID", "").strip()
              if not udid:
                  print("[DEVICE_CHECK] UNVERIFIED")
              else:
                  with open(os.path.join(os.environ["RUNNER_TEMP"], "signing", "profile.plist"), "rb") as profile_file:
                      profile = plistlib.load(profile_file)
                  devices = profile.get("ProvisionedDevices")
                  if not isinstance(devices, list):
                      print("[DEVICE_CHECK] UNVERIFIED")
                  elif any(isinstance(device, str) and device == udid for device in devices):
                      print("[DEVICE_CHECK] MATCH")
                  else:
                      print("[DEVICE_CHECK] NO_MATCH")
          except Exception:
              print("[DEVICE_CHECK] UNVERIFIED")
          PY

          echo "[SIGNING_TRACE] Provisioning profile copy: START"
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "[SIGNING_TRACE] Provisioning profile copy: DONE"

          echo "[SIGNING_TRACE] GITHUB_ENV write: START"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "[SIGNING_TRACE] GITHUB_ENV write: DONE"
          echo "[SIGNING_TRACE] Provisioning profile processing: DONE"

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install

      - name: Detect iOS workspace and scheme
        run: |
          set -e

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "iOS workspace bulunamadý."
            exit 1
          fi

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list |
            awk '/Schemes:/ {found=1; next} found && NF {print $1; exit}')

          if [ -z "$SCHEME" ]; then
            echo "Xcode scheme bulunamadý."
            exit 1
          fi

          echo "IOS_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          echo "Provisioning Profile: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sardurtechnologies.beslipatron</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Archive
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/archive"

          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/archive/BeþliPatron.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=WNF86CPGX5 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/export"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/archive/BeþliPatron.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: besli-patron-ios-adhoc
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error


