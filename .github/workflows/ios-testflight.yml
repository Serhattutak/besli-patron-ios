name: iOS TestFlight Upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Apple signing files
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$IOS_DIST_CERT_BASE64"
          test -n "$IOS_DIST_CERT_PASSWORD"
          test -n "$IOS_APPSTORE_PROFILE_BASE64"

          mkdir -p "$RUNNER_TEMP/signing"

          printf "%s" "$IOS_DIST_CERT_BASE64" |
            tr -d '[:space:]' |
            base64 -D > "$RUNNER_TEMP/signing/dist-cert.p12"

          printf "%s" "$IOS_APPSTORE_PROFILE_BASE64" |
            tr -d '[:space:]' |
            base64 -D > "$RUNNER_TEMP/signing/profile.mobileprovision"

          security create-keychain \
            -p "" "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -s "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "" "$RUNNER_TEMP/build.keychain-db"

          security set-keychain-settings \
            -lut 21600 "$RUNNER_TEMP/build.keychain-db"

          security import "$RUNNER_TEMP/signing/dist-cert.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" "$RUNNER_TEMP/build.keychain-db"

          security cms -D \
            -i "$RUNNER_TEMP/signing/profile.mobileprovision" \
            > "$RUNNER_TEMP/signing/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print:UUID" \
              "$RUNNER_TEMP/signing/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print:Name" \
              "$RUNNER_TEMP/signing/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print:Entitlements:application-identifier" \
              "$RUNNER_TEMP/signing/profile.plist"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print:TeamIdentifier:0" \
              "$RUNNER_TEMP/signing/profile.plist"
          )

          PROFILE_METHOD=$(
            /usr/libexec/PlistBuddy \
              -c "Print:ProvisionsAllDevices" \
              "$RUNNER_TEMP/signing/profile.plist" 2>/dev/null || true
          )

          case "$PROFILE_APP_ID" in
            "WNF86CPGX5.com.sardurtechnologies.beslipatron")
              ;;
            *)
              echo "::error::Provisioning profile Bundle ID/team does not match."
              exit 1
              ;;
          esac

          if [ "$PROFILE_TEAM" != "WNF86CPGX5" ]; then
            echo "::error::Provisioning profile team ID does not match."
            exit 1
          fi

          if /usr/libexec/PlistBuddy \
            -c "Print:ProvisionedDevices" \
            "$RUNNER_TEMP/signing/profile.plist" >/dev/null 2>&1; then
            echo "::error::The supplied profile contains device UDIDs; use an App Store profile."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$RUNNER_TEMP/signing/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "App Store provisioning profile verified."

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install

      - name: Detect workspace and scheme
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No Xcode workspace found."
            exit 1
          fi

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list |
            awk '/Schemes:/ {found=1; next} found && NF {print $1; exit}')

          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme found."
            exit 1
          fi

          echo "IOS_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>WNF86CPGX5</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sardurtechnologies.beslipatron</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Archive
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/archive"

          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/archive/BesliPatron.xcarchive" \
            DEVELOPMENT_TEAM=WNF86CPGX5 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/export"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/archive/BesliPatron.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          test -n "$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          test -n "$APP_STORE_CONNECT_API_KEY_P8"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"

          KEY_DIR="$RUNNER_TEMP/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"

          cleanup() {
            rm -f "$KEY_FILE"
          }
          trap cleanup EXIT

          printf "%s" "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          IPA_FILE=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_FILE"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
