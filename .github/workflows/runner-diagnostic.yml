name: GitHub Actions Runner Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm hosted runner allocation
        run: |
          echo "GitHub-hosted Ubuntu runner started successfully."
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
