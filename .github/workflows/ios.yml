name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          xcode_path="/Applications/Xcode_16.4.app/Contents/Developer"
          test -d "$xcode_path"
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Set up Node.js 20.19.4
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Find BeliPatron workspace and scheme
        shell: bash
        run: |
          set -euo pipefail
          workspace=""
          for candidate in ios/*.xcworkspace; do
            [ -d "$candidate" ] || continue
            workspace="$candidate"
            break
          done
          if [[ -z "$workspace" ]]; then
            echo "No app .xcworkspace found under ios/"
            exit 1
          fi

          scheme="$(python3 - "$workspace" <<'PY'
          import json
          import os
          import subprocess
          import sys

          workspace = sys.argv[1]
          result = subprocess.run(
              ["xcodebuild", "-list", "-json", "-workspace", workspace],
              check=True,
              capture_output=True,
              text=True,
          )
          schemes = json.loads(result.stdout).get("workspace", {}).get("schemes", [])
          stem = os.path.basename(workspace)[:-len(".xcworkspace")]

          for preferred in ("BeliPatron", stem):
              if preferred in schemes:
                  print(preferred)
                  break
          else:
              app_schemes = [name for name in schemes if not name.startswith("Pods-")]
              if len(app_schemes) != 1:
                  raise SystemExit("Could not identify a unique app scheme. Available: " + ", ".join(schemes))
              print(app_schemes[0])
          PY
          )"

          echo "Using workspace: $workspace"
          echo "Using scheme: $scheme"
          echo "IOS_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$scheme" >> "$GITHUB_ENV"

      - name: Install Apple signing assets
        if: ${{ env.APPLE_TEAM_ID != '' && env.IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' && env.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/app.mobileprovision"
          keychain_path="$RUNNER_TEMP/ios-build.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Archive and export signed IPA
        if: ${{ env.APPLE_TEAM_ID != '' && env.IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' && env.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/BeliPatron.xcarchive"
          export_options="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="$IOS_PROFILE_UUID" \
            archive

          python3 - "$export_options" <<'PY'
          import os
          import plistlib
          import sys

          options = {
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "provisioningProfiles": {
                  "com.sardurtechnologies.beslipatron": os.environ["IOS_PROFILE_NAME"]
              },
          }
          with open(sys.argv[1], "wb") as output:
              plistlib.dump(options, output)
          PY

          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$export_options"

      - name: Note that signing secrets are not configured
        if: ${{ env.APPLE_TEAM_ID == '' || env.IOS_DISTRIBUTION_CERTIFICATE_BASE64 == '' || env.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD == '' || env.IOS_PROVISIONING_PROFILE_BASE64 == '' }}
        run: echo "Apple signing secrets are not configured; device archive and IPA export were skipped."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: besli-patron-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
